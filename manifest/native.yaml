- addr: 0x00745650
  kind: func_replace
  source: native
  group: platform-probe
  target: ma_get_dx_version
  notes: "GetDXVersion probes ddraw, d3d8, dpnhpast and d3d9 DLLs; the native layer always provides Direct3D 9"

- addr: 0x008d6218
  kind: data_poke
  source: native
  group: display-mode
  bytes: "00000000"
  notes: "defaultFullscreenRes: psSelectDevice no longer insists on an 800x600x32 mode; the native D3D9 layer lists the host mode list"

- addr: 0x008d6220
  kind: data_poke
  source: native
  group: display-mode
  bytes: "01000000"
  notes: "GcurSelVM starts at RW video mode 1, the first exclusive mode, instead of -1; mode 0 is the windowed desktop mode"

- addr: 0x00745af0
  kind: func_replace
  source: native
  group: display-mode
  target: ma_get_video_mode_list
  notes: "GetVideoModeList labels only 4:3, 5:4, 5:3 and 16:10 modes that leave 45 MB of video memory; the native list labels every exclusive mode of at least 640x480 from the host mode list, so the menu offers exactly those modes"

- addr: 0x00ba681c
  kind: data_poke
  source: native
  group: display-mode
  bytes: "0100000001000000"
  notes: "FrontEndMenuManager m_nPrefsVideoMode and m_nDisplayVideoMode start at RW video mode 1; with defaultFullscreenRes cleared the first-run sync from GcurSelVM never runs"

- addr: 0x00406560
  kind: marker
  source: native
  group: cdstream-tso
  tso: true
  notes: "CdStreamThread publishes channel status, nSectorsToRead and the read buffer with plain stores that CdStreamSync and the streaming code read without locks; acquire/release ordering keeps x86 TSO on arm64"

- addr: 0x0156cd80
  kind: marker
  source: native
  group: cdstream-tso
  tso: true
  notes: "CdStreamSync checks nSectorsToRead and sets bLocked before waiting on the channel semaphore"

- addr: 0x01563850
  kind: marker
  source: native
  group: cdstream-tso
  tso: true
  notes: "CdStreamGetStatus polls channel status and nSectorsToRead without a lock"

- addr: 0x00748d1f
  kind: mid_hook
  source: native
  group: frame-limiter
  target: sp_frame_pacing
  resume: 0x00748d98, 0x00748da3
  notes: "Replaces SilentPatch's frame limiter: the main loop's limiter test (menu Frame Limiter, forced limit, cutscene audio) sleeps on the host clock until the next frame at silentpatch.frame_limit, then renders; it never spins the loop"
